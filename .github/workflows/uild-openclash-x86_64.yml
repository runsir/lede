# 在 GitHub Actions 上编译「只带 OpenClash」的 x86_64 软路由固件
#
# 源码：当前仓库（也就是你自己的 lede fork），所以不需要再 clone 一次。
# 产物：bin/targets/x86/64/*.img.gz（BIOS + EFI 两个版本）
# 触发：Actions 页面手动运行，或推送 v* 标签（会自动建 Release）
#
# 目录约定（都需要提交到仓库根目录）：
#   .github/workflows/build-openclash-x86_64.yml   <- 本文件
#   configs/x86_64-openclash.config                <- 包选择（seed config）
#   configs/zz-openclash-bypass                    <- 首次开机写入旁路网络配置
#   （编译时会被安装到 files/etc/uci-defaults/，因为 Lean 源码的 .gitignore
#     忽略了 /files 目录，放在 configs/ 里才能正常提交）

name: Build OpenClash x86_64

run-name: OpenClash x86_64 (${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      openclash_ref:
        description: "OpenClash 仓库的分支或标签（默认 master）"
        required: false
        default: "master"
  push:
    tags:
      - "v*"

permissions:
  contents: write          # 打 tag 时创建 Release 需要

concurrency:
  group: build-openclash-x86-64-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build x86_64 firmware
    runs-on: ubuntu-22.04        # 不要换成 24.04：Lean 的 lede 在 22.04 上最稳
    timeout-minutes: 350         # GitHub 单个 job 上限 6 小时

    env:
      DEBIAN_FRONTEND: noninteractive
      OPENCLASH_REF: ${{ inputs.openclash_ref || 'master' }}

    steps:
      # ------------------------------------------------------------------ #
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------------ #
      - name: Free disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /opt/az \
            /usr/lib/heroku \
            /opt/microsoft \
            /usr/share/swift
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /

      # ------------------------------------------------------------------ #
      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get -y install \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler flex g++-multilib gawk gcc-multilib genisoimage \
            gettext git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool lrzsz msmtp \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs unzip upx-ucl vim wget xmlto xxd zip zlib1g-dev \
            zstd lz4
          sudo apt-get clean
          df -h /

      # ------------------------------------------------------------------ #
      - name: Add OpenClash feed and update all feeds
        run: |
          set -eux
          # 幂等：先删掉旧的 openclash feed 行，再追加
          sed -i '/^src-git openclash/d' feeds.conf.default
          # 防止文件末尾没有换行时把新 feed 拼到上一行注释里
          if [ -n "$(tail -c 1 feeds.conf.default)" ]; then echo >> feeds.conf.default; fi
          echo "src-git openclash https://github.com/vernesong/OpenClash.git;${OPENCLASH_REF}" >> feeds.conf.default
          tail -n 3 feeds.conf.default

          retry() {
            n=0
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge 3 ]; then
                echo "::error::command failed after $n attempts: $*"
                return 1
              fi
              echo "retry $n: $*"
              sleep 10
            done
          }

          retry ./scripts/feeds update -a
          retry ./scripts/feeds install -a
          echo "OpenClash feed commit: $(git -C feeds/openclash rev-parse HEAD)"

      # ------------------------------------------------------------------ #
      # OpenClash 的 Makefile 里没有把 luci-base 写成依赖，而 Build/Prepare
      # 需要 luci-base 的 host 工具 po2lmo。补一个依赖，保证编译顺序正确，
      # 避免 -j 并行时偶发 "po2lmo: not found"。
      - name: Make OpenClash wait for luci-base host tools
        run: |
          set -eux
          f=package/feeds/openclash/luci-app-openclash/Makefile
          if grep -q 'DEPENDS:=.*luci-base' "$f"; then
            echo "already depends on luci-base"
          else
            # 只在第一条 DEPENDS:= 上插入，awk 比 sed 的 0,/re/ 更可移植
            awk 'BEGIN { done = 0 }
                 {
                   if (!done && $0 ~ /^[[:space:]]*DEPENDS:=/) {
                     sub(/DEPENDS:=/, "DEPENDS:=+luci-base ")
                     done = 1
                   }
                   print
                 }' "$f" > "$f.new"
            mv "$f.new" "$f"
          fi
          grep -q 'DEPENDS:=.*luci-base' "$f" || {
            echo "::error::failed to inject luci-base dependency into $f"
            exit 1
          }
          grep -n -A2 'DEPENDS:=' "$f"

      # ------------------------------------------------------------------ #
      # Lean 的 lede 在 .gitignore 里忽略了 /files，所以旁路配置脚本放在
      # configs/ 里提交，编译前再安装到 files/（OpenWrt 的 rootfs overlay）。
      - name: Install first-boot bypass defaults
        run: |
          set -eux
          sed -i 's/\r$//' configs/zz-openclash-bypass      # 防止 Windows 换行
          install -D -m 0755 configs/zz-openclash-bypass files/etc/uci-defaults/zz-openclash-bypass
          sh -n files/etc/uci-defaults/zz-openclash-bypass
          ls -l files/etc/uci-defaults/zz-openclash-bypass

      # ------------------------------------------------------------------ #
      - name: Generate .config
        run: |
          set -eux
          sed -i 's/\r$//' configs/x86_64-openclash.config
          cp configs/x86_64-openclash.config .config
          make defconfig

          echo "================ key options ================"
          grep -E '^CONFIG_(TARGET_x86_64_DEVICE_generic|PACKAGE_(luci-app-openclash|luci-compat|luci-lua-runtime|luci-app-ttyd|luci-theme-design|dnsmasq-full|kmod-tun|kmod-nft-tproxy|kmod-inet-diag|ruby|ruby-yaml))=y$' .config || true
          echo "=========== explicit disables (may be absent) ==========="
          grep -E '^# CONFIG_PACKAGE_luci-app-(ssr-plus|turboacc|upnp|ddns)' .config || true

          for p in \
            luci-app-openclash \
            luci-compat \
            luci-lua-runtime \
            dnsmasq-full \
            kmod-tun \
            kmod-nft-tproxy \
            kmod-inet-diag \
            ruby \
            ruby-yaml; do
            if ! grep -q "^CONFIG_PACKAGE_${p}=y$" .config; then
              echo "::error::CONFIG_PACKAGE_${p} 没有被启用，请检查上面的 defconfig 输出（通常是 feed 拉取失败或依赖缺失）"
              exit 1
            fi
          done

      # ------------------------------------------------------------------ #
      - name: Download sources
        run: |
          set -eux
          ok=0
          for i in 1 2 3; do
            if make -j"$(nproc)" download; then ok=1; break; fi
            echo "download failed (attempt $i), retrying..."
            sleep 15
          done
          [ "$ok" = "1" ] || { echo "::error::make download 连续失败，多半是上游下载源网络问题，请重跑"; exit 1; }

      # ------------------------------------------------------------------ #
      - name: Compile firmware
        run: |
          set -o pipefail
          if ! make -j"$(nproc)" 2>&1 | tee build.log; then
            echo "::warning::并行编译失败，改用单线程重跑以输出可读的错误日志"
            make -j1 V=s 2>&1 | tee -a build.log
          fi

      # ------------------------------------------------------------------ #
      - name: Verify OpenClash is really in the image
        run: |
          set -eux
          ls -lh bin/targets/x86/64/
          manifest=$(ls bin/targets/x86/64/*.manifest 2>/dev/null | head -n1) || true
          [ -n "$manifest" ] || {
            echo "::error::没有生成 manifest，说明镜像构建失败"
            exit 1
          }
          echo "manifest: $manifest"
          for p in luci-app-openclash ruby ruby-yaml kmod-tun kmod-nft-tproxy kmod-inet-diag dnsmasq-full; do
            grep -q "^${p} " "$manifest" || {
              echo "::error::${p} 没有出现在固件 manifest 中，固件不完整"
              exit 1
            }
          done
          for p in luci-app-ssr-plus luci-app-turboacc luci-app-upnp luci-app-ddns; do
            if grep -q "^${p} " "$manifest"; then
              echo "::error::${p} 不应该出现在「只带 OpenClash」的固件里"
              exit 1
            fi
          done
          grep -E '^(luci-app-openclash|ruby|ruby-yaml|kmod-tun|kmod-nft-tproxy|kmod-inet-diag) ' "$manifest"

      # ------------------------------------------------------------------ #
      - name: Collect build info
        run: |
          set -eux
          mkdir -p build-info
          cp .config build-info/config.txt
          cp feeds.conf.default build-info/feeds.conf
          git log -1 --format='source: %H %cd %s' > build-info/source.txt
          git -C feeds/openclash log -1 --format='openclash: %H %cd %s' > build-info/openclash.txt
          cd bin/targets/x86/64
          sha256sum *.img.gz *.manifest 2>/dev/null > SHA256SUMS || true
          ls -lh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openclash-x86_64-firmware
          path: |
            bin/targets/x86/64/*.img.gz
            bin/targets/x86/64/*.manifest
            bin/targets/x86/64/*.buildinfo
            bin/targets/x86/64/SHA256SUMS
            build-info/
          if-no-files-found: error
          retention-days: 30

      - name: Upload ipk packages (optional for later installs)
        uses: actions/upload-artifact@v4
        with:
          name: openclash-x86_64-packages
          path: bin/packages/x86_64/**/*.ipk
          if-no-files-found: warn
          retention-days: 15

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      # ------------------------------------------------------------------ #
      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/targets/x86/64/*.img.gz
            bin/targets/x86/64/*.manifest
            bin/targets/x86/64/SHA256SUMS
            build-info/*
          body: |
            x86_64 软路由固件（Lean's LEDE + OpenClash），旁路模式预配置。

            * 默认 LAN：`192.168.1.2/24`，网关/DNS：`192.168.1.1`，DHCP 已关闭
            * 后台：<http://192.168.1.2>，用户名 `root`，密码 `password`（首次登录请立刻修改）
            * 刷写：BIOS 机器用 `combined.img.gz`，UEFI 机器用 `combined-efi.img.gz`
            * 解压后得到 `.img`，用 Rufus / balenaEtcher / `dd` 写入 U 盘或硬盘

            详细说明见仓库中的 `README-openclash-x86_64.md`。

      - name: Job summary
        if: success()
        run: |
          {
            echo "## OpenClash x86_64 编译完成"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 源码 commit | \`$(git rev-parse --short HEAD)\` |"
            echo "| OpenClash commit | \`$(git -C feeds/openclash rev-parse --short HEAD)\` |"
            echo "| 默认后台 | http://192.168.1.2 （root / password） |"
            echo ""
            echo "### 产物"
            echo '```'
            ls -lh bin/targets/x86/64/*.img.gz
            echo '```'
            echo ""
            echo "BIOS 用 \`*-combined.img.gz\`，UEFI 用 \`*-combined-efi.img.gz\`。"
          } >> "$GITHUB_STEP_SUMMARY"
